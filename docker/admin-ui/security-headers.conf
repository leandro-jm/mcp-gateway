# Included by the server block and by every location that sets its own headers (see nginx.conf.template).
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# The inline script in index.html (theme/locale before first paint) is allowed by its hash: update it when the script changes.
# CodeMirror injects <style> elements, hence 'unsafe-inline' for styles only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-+GR3rKK8GfASAhiEBJKbZKMrk5td+zZv5QRw2fmlItE='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
