# Production stack (compatible with Portainer "Stacks"): images only, configured through variables.
# Images: ${IMAGE_NAMESPACE}/mcp-gateway[-crawler|-admin-ui]:${TAG}. Default namespace is Docker Hub (leandrojm);
# use IMAGE_NAMESPACE=ghcr.io/leandro-jm for GHCR.
# Required variables: see docs/deploy.md ("Variáveis" section).
name: ${STACK_NAME:-mcp-gateway}

x-node-env: &node-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: 'postgres://gateway:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/gateway'
  REDIS_URL: redis://redis:6379
  GATEWAY_MASTER_KEY: '${GATEWAY_MASTER_KEY:?set GATEWAY_MASTER_KEY, generate it with openssl rand -base64 32}'
  NETWORK_ALLOW_PRIVATE: ${NETWORK_ALLOW_PRIVATE:-false}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gateway
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gateway -d gateway']
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    # pinned by digest (RELEASE.2025-09-07T16-13-09Z): `latest` would change under a redeploy
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-gateway}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?defina S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 30

  # Migrations as a separate job: runs and exits; gateway and crawler wait for it to succeed.
  migrate:
    image: ${IMAGE_NAMESPACE:-leandrojm}/mcp-gateway:${TAG:-latest}
    restart: 'no'
    command: ['node', 'dist/migrate.js', 'up']
    environment:
      DATABASE_URL: postgres://gateway:${POSTGRES_PASSWORD}@postgres:5432/gateway
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: ${IMAGE_NAMESPACE:-leandrojm}/mcp-gateway:${TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *node-env
      PORT: '4000'
      PUBLIC_URL: '${PUBLIC_URL:?set PUBLIC_URL, e.g. https://mcp.example.com}'
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-gateway}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-mcp-artifacts}
      METRICS_TOKEN: '${METRICS_TOKEN:?set METRICS_TOKEN, generate it with openssl rand -hex 32}'
      # X-Forwarded-For is only trusted from these proxies (false, a hop count or IPs/CIDRs)
      TRUST_PROXY: ${TRUST_PROXY:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      EMBEDDINGS_URL: ${EMBEDDINGS_URL:-}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      AUDIT_RETENTION_MONTHS: ${AUDIT_RETENTION_MONTHS:-12}
      # agent observability (F15, ADR-016/017)
      CALL_EVENTS_RETENTION_DAYS: ${CALL_EVENTS_RETENTION_DAYS:-30}
      CALL_ROLLUPS_RETENTION_DAYS: ${CALL_ROLLUPS_RETENTION_DAYS:-400}
      SUBJECT_INDEX_RETENTION_MONTHS: ${SUBJECT_INDEX_RETENTION_MONTHS:-12}
      DEBUG_CAPTURE_ENABLED: ${DEBUG_CAPTURE_ENABLED:-false}
      TRACE_UI_URL_TEMPLATE: ${TRACE_UI_URL_TEMPLATE:-}
    ports:
      - '${GATEWAY_PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/readyz >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  crawler:
    image: ${IMAGE_NAMESPACE:-leandrojm}/mcp-gateway-crawler:${TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *node-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  admin-ui:
    image: ${IMAGE_NAMESPACE:-leandrojm}/mcp-gateway-admin-ui:${TAG:-latest}
    restart: unless-stopped
    environment:
      GATEWAY_URL: http://gateway:4000
    ports:
      - '${ADMIN_UI_PORT:-8080}:8080'
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
