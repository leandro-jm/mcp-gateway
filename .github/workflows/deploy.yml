name: deploy

# Optional, manual deploy example (docs/deploy.md §8): migrations run as a separate job first,
# then the stack is updated through a Portainer webhook. Forks without the secrets skip every job.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker Hub image tag (published from v* tags), e.g. 0.1.0'
        required: true
      environment:
        description: Environment
        type: choice
        options: [staging, production]
        default: staging

jobs:
  guard:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check deploy secrets
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PORTAINER_STACK_WEBHOOK: ${{ secrets.PORTAINER_STACK_WEBHOOK }}
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$PORTAINER_STACK_WEBHOOK" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABASE_URL or PORTAINER_STACK_WEBHOOK is not set for '${{ inputs.environment }}'; skipping deploy."
          fi

  migrate:
    needs: guard
    if: needs.guard.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Run migrations (gateway image, migrate command)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm -e DATABASE_URL \
            docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'leandrojm' }}/mcp-gateway:${{ inputs.tag }} \
            node dist/migrate.js up

  deploy:
    needs: [guard, migrate]
    if: needs.guard.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Update the Portainer stack (stack webhook)
        env:
          PORTAINER_STACK_WEBHOOK: ${{ secrets.PORTAINER_STACK_WEBHOOK }}
        run: curl -fsS -X POST "${PORTAINER_STACK_WEBHOOK}?TAG=${{ inputs.tag }}"
