name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      # Testcontainers uses the runner's Docker (Postgres/pgvector, Redis, MinIO).
      # Also covers the security suite (apps/gateway/test/security, `pnpm test:security`).
      - name: Integration tests
        run: pnpm test:int

  # Images on every push: GHCR always; Docker Hub (public) on main (tags `main` and `sha-<commit>`) and on v* tags
  # (`X.Y.Z`, `X.Y`, `latest`, multi-arch). Docker Hub needs the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets
  # (optional variables: DOCKERHUB_NAMESPACE, MAIN_PLATFORMS for the main builds, default linux/amd64).
  images:
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'leandrojm' }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      DOCKERHUB: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.DOCKERHUB_TOKEN != '' }}
    strategy:
      matrix:
        include:
          - image: mcp-gateway
            dockerfile: docker/node-app.Dockerfile
            build-args: APP=gateway
          - image: mcp-gateway-crawler
            dockerfile: docker/node-app.Dockerfile
            build-args: APP=crawler
          - image: mcp-gateway-admin-ui
            dockerfile: docker/admin-ui.Dockerfile
            build-args: |
              VITE_ENV_LABEL=PROD
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: env.DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
            name=docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }},enable=${{ env.DOCKERHUB }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          platforms: ${{ env.RELEASE == 'true' && 'linux/amd64,linux/arm64' || vars.MAIN_PLATFORMS || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: mode=max
          sbom: ${{ env.RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Sync the Docker Hub description
        if: env.RELEASE == 'true' && env.DOCKERHUB == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          readme-filepath: docker/dockerhub/README.md

  # Continuous deployment (optional): once the images are on Docker Hub, redeploys the Dokploy compose service
  # (docs/deploy.md, "Dokploy"). Needs the DOKPLOY_URL, DOKPLOY_API_KEY and DOKPLOY_COMPOSE_ID secrets; skipped
  # without them, so forks do not fail.
  deploy:
    needs: images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy on Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          TITLE: 'CI ${{ github.ref_name }} ${{ github.sha }}'
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::notice::Dokploy secrets are not set; skipping the deploy."
            exit 0
          fi
          body=$(jq -n --arg id "$DOKPLOY_COMPOSE_ID" --arg title "${TITLE:0:60}" '{composeId: $id, title: $title}')
          curl -fsS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'content-type: application/json' -d "$body"
          echo "Dokploy deploy queued for compose $DOKPLOY_COMPOSE_ID"
